<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact form for getting in touch with me.">
    <title> Contact | My Portfolio </title>
</head>

<body>

    <header>
        <h1> Contact Me </h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="Arevalo_Index.html"> Home </a></li>
                <li><a href="Arevalo_About.html"> About </a></li>
                <li><a href="Arevalo_Skills.html"> Skills </a></li>
                <li><a href="Arevalo_Contact.html" aria-current="page"> Contact </a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2> Get in Touch </h2>

            <p>
                If you would like to contact me, please complete the form
                below.
            </p>

            <form action="#" method="post">

                <div>
                    <label for="name"> Full Name: </label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="email">Email Address:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="phone">Phone Number:</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        autocomplete="tel"
                    >
                </div>

                <div>
                    <label for="subject">Subject:</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >
                </div>

                <div>
                    <label for="message">Message:</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <div>
                    <button type="submit">Send Message</button>
                    <button type="reset">Clear Form</button>
                </div>

            </form>
        </section>

        <aside>
            <h2> Contact Information </h2>

            <p>
                You can use the form above to send a message or ask
                questions about my portfolio and projects.
            </p>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio. All rights reserved.</p>
    </footer>

</body>
</html>
