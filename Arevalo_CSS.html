<!DOCTYPE html>
<html>
<head>
    <title>CSS Seatwork</title>
    <style>
/* CSS styles for the student profile */
      body {
        font-family: Arial, sans-serif;
        background-color: #eeeeee;
        margin: 20px;
        padding: 25px;
display: flex;
justify-content: center;
      }  

    /* Profile container */
    .profile {
        width: 400px;
        background-color: white;
        border-radius: 2px solid lightgray;
        padding: ;25px;
        text-align: center;
        box-sizing: border-box;
    }

    /* main heading */
    h1 {
        background-color: navy;
        color: white;
        padding: 15px;
        margin-bottom: 20px;
    }

    /* Profile image */
    img {
        width: 100px;
        height: 100px;
        display: block;
        margin: 0 auto 15px;
    }

    /* Subheadings and Text*/
    h2 {
        margin: 10px 0 5px 0;
        color: navy;
    }

    .program {
        font-style: italic;
        color: gray;
        margin-top: 0;
        margin-bottom: 20px;
        text-align: center;
    }

    h3 {
        color: navy;
        border-bottom: 2px solid lightblue;
        padding-bottom: 5px;
        text-align: left;
        margin-top: 20px;
    }

    /*Text content alignment*/
    p {
        text-align: left;
        margin-bottom: 15px;
    }

    /*Table Styling*/
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        margin-bottom: 20px;
    }

    th {
        background-color:lightblue;
        color: navy;
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid lightgray;
    }

    td {
        padding: 8px;
        text-align: left;
        border-bottom: 1px solid lightgray;
    }

    /* Footer Styling */
    .footer {
        font-style: italic;
        color: gray;
        text-align: center;
        margin-top: 25px;
        margin-bottom: 0;
        margin-top: 1px; solid lightgray;
        padding-top: 15px;
    }
            </style>
        </head>
        <body>

        <div class="profile">

        <h1>STUDENT PROFILE</h1>

        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/html5/html5-original.svg"
             alt="HTML Logo">

        <h2>Alex Rivera</h2>
        <p class="program">BS Information Technology</p>

        <h3>About Me</h3>

        <p>
            I am an IT student interested in web development,
            programming, and user interface design.
        </p>

        <h3>Current Courses</h3>

        <table>
            <tr>
                <th>Course</th>
                <th>Units</th>
            </tr>
            <tr>
                <td>Web Design</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Programming</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Database Systems</td>
                <td>3</td>
            </tr>
        </table>

        <p class="footer">Learning one line of code at a time.</p>

    </div>

</body>
</html>
